services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: courte
      POSTGRES_PASSWORD: courte
      POSTGRES_DB: courte
    ports:
      - "5432:5432"
    volumes:
      - courte_pg:/var/lib/postgresql/data
    command: ["postgres", "-c", "max_connections=100"]

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: courte-api
    restart: unless-stopped
    ports:
      - "3001:3001"
    env_file:
      - apps/api/.env
    environment:
      PORT: 3001

volumes:
  courte_pg:
